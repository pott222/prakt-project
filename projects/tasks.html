<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список задач — why2k</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <header class="header">
    <div class="todo-nav container">
      <a class="logo" href="../index.html">why2k<span>.</span></a>
      <a class="todo-back-link" href="../index.html#projects">К проектам</a>
    </div>
  </header>

  <main class="todo-page container">
    <section class="todo-app" aria-labelledby="todo-title">
      <h1 class="todo-heading" id="todo-title">Список задач</h1>
      <ul class="todo-list" aria-label="Задачи">
        <li class="todo-task">
          <label class="todo-task__label">
            <input type="checkbox" />
            <span>Собрать портфолио</span>
          </label>
        </li>
        <li class="todo-task">
          <label class="todo-task__label">
            <input type="checkbox" />
            <span>Добавить проекты</span>
          </label>
        </li>
        <li class="todo-task">
          <label class="todo-task__label">
            <input type="checkbox" />
            <span>Проверить адаптивность</span>
          </label>
        </li>
      </ul>
    </section>
  </main>
</body>
</html>
